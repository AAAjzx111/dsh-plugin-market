name: Check TypeScript scripts

on:
  pull_request:
    paths: ['plugins/**', 'scripts/**', 'package.json', 'pnpm-lock.yaml', 'tsconfig.json', '.github/workflows/check.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
